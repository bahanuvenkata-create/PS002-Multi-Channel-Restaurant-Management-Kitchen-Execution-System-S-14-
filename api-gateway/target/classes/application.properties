spring.application.name=api-gateway
server.port=8000

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true

# Spring Cloud Gateway Routing Configuration
spring.cloud.gateway.routes[0].id=AUTH-SERVICE
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.routes[1].id=MENU-SERVICE
spring.cloud.gateway.routes[1].uri=lb://MENU-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/menu/**

spring.cloud.gateway.routes[2].id=ORDER-SERVICE
spring.cloud.gateway.routes[2].uri=lb://ORDER-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/orders/**

spring.cloud.gateway.routes[3].id=RESTAURANT-API
spring.cloud.gateway.routes[3].uri=lb://MENU-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/restaurants/**

spring.cloud.gateway.routes[4].id=CHATBOT-API
spring.cloud.gateway.routes[4].uri=lb://MENU-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/chatbot/**

spring.cloud.gateway.routes[5].id=TIFFIN-API
spring.cloud.gateway.routes[5].uri=lb://ORDER-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/tiffins/**

spring.cloud.gateway.routes[6].id=TABLE-API
spring.cloud.gateway.routes[6].uri=lb://ORDER-SERVICE
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/tables/**

spring.cloud.gateway.routes[7].id=PAYMENT-API
spring.cloud.gateway.routes[7].uri=lb://ORDER-SERVICE
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/payments/**

spring.cloud.gateway.routes[8].id=REVIEW-API
spring.cloud.gateway.routes[8].uri=lb://ORDER-SERVICE
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/reviews/**

# SpringDoc OpenAPI Aggregated Swagger UI on Port 8000
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=1. Auth & User Identity Service
springdoc.swagger-ui.urls[0].url=/v3/api-docs/auth-service
springdoc.swagger-ui.urls[1].name=2. Menu, Restaurants & Chatbot Service
springdoc.swagger-ui.urls[1].url=/v3/api-docs/menu-service
springdoc.swagger-ui.urls[2].name=3. Orders, Kitchen KDS, Payments & Reviews Service
springdoc.swagger-ui.urls[2].url=/v3/api-docs/order-service

# OpenAPI Docs Routing to Microservices
spring.cloud.gateway.routes[9].id=AUTH-DOCS
spring.cloud.gateway.routes[9].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[9].predicates[0]=Path=/v3/api-docs/auth-service
spring.cloud.gateway.routes[9].filters[0]=RewritePath=/v3/api-docs/auth-service, /v3/api-docs

spring.cloud.gateway.routes[10].id=MENU-DOCS
spring.cloud.gateway.routes[10].uri=lb://MENU-SERVICE
spring.cloud.gateway.routes[10].predicates[0]=Path=/v3/api-docs/menu-service
spring.cloud.gateway.routes[10].filters[0]=RewritePath=/v3/api-docs/menu-service, /v3/api-docs

spring.cloud.gateway.routes[11].id=ORDER-DOCS
spring.cloud.gateway.routes[11].uri=lb://ORDER-SERVICE
spring.cloud.gateway.routes[11].predicates[0]=Path=/v3/api-docs/order-service
spring.cloud.gateway.routes[11].filters[0]=RewritePath=/v3/api-docs/order-service, /v3/api-docs

